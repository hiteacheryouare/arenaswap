name: Setup
description: Node, the npm version package.json pins, dependencies, and a restored turbo cache.

inputs:
  turbo-cache-key:
    description: Separates each job's turbo cache so parallel jobs never race to save the same key.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm

    # Node 26 bundles npm 11, which ignores the allowScripts block in package.json.
    - name: Install pinned npm
      shell: bash
      run: npm install --global "$(node -p "require('./package.json').packageManager")"

    - name: Cache Cypress binary
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Restore turbo cache
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-

    # Every run restores the previous cache and adds to it, so without this it only ever grows.
    - name: Prune turbo cache entries older than a week
      shell: bash
      run: '[ -d .turbo/cache ] && find .turbo/cache -type f -mtime +7 -delete || true'
