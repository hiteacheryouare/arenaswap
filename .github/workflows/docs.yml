name: Deploy Docs

on:
  push:
    branches: [mega]
    paths:
      - 'apps/docs/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'packages/powerscore/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build docs
        run: npm run build --workspace=@arenaswap/docs

      - name: Commit built docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: rebuild docs site [skip ci]"
          git push
