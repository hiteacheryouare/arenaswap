name: Deploy Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [mega]
  workflow_dispatch:

concurrency:
  group: docs-deploy

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mega') || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    outputs:
      deploy: ${{ steps.current.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build the commit CI just passed, not whatever mega has moved on to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A newer push has its own CI run, which deploys newer docs. Building this one would only
      # put older docs on the site.
      - name: Check mega has not moved on
        id: current
        run: |
          git fetch --depth=1 origin mega
          if [ "${{ github.event_name }}" = workflow_run ] && [ "$(git rev-parse FETCH_HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        if: steps.current.outputs.deploy == 'true'
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: docs

      - name: Build docs
        if: steps.current.outputs.deploy == 'true'
        run: npx turbo run build --filter=@arenaswap/docs

      - name: Upload site
        if: steps.current.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
