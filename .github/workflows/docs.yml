name: Deploy Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [mega]
  workflow_dispatch:

concurrency:
  group: docs-deploy

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build the commit CI just passed, not whatever mega has moved on to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npx turbo run build --filter=@arenaswap/docs

      - name: Commit built docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && exit 0
          git commit -m "chore: rebuild docs site [skip ci]"
          # Another push can land between the checkout and here; rebase onto it
          # rather than failing the deploy outright.
          for attempt in 1 2 3; do
            git pull --rebase origin mega && git push origin HEAD:mega && exit 0
            sleep 5
          done
          exit 1
