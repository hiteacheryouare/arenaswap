name: Dependabot Auto-Merge and PR Management

on:
  # Dependabot PRs get a read-only GITHUB_TOKEN on `pull_request`, so the write
  # operations below only work under `pull_request_target`. Listing both ran the
  # whole job twice on every Dependabot PR.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Get package info
        id: package-info
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.dependency-names }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "update_type=$UPDATE_TYPE" >> $GITHUB_OUTPUT

          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            echo "upgrade_label=MAJOR" >> $GITHUB_OUTPUT
          elif [[ "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            echo "upgrade_label=MINOR" >> $GITHUB_OUTPUT
          else
            echo "upgrade_label=PATCH" >> $GITHUB_OUTPUT
          fi

      - name: Update PR title and body
        uses: actions/github-script@v9
        env:
          PACKAGE_NAME: ${{ steps.package-info.outputs.package_name }}
          PREVIOUS_VERSION: ${{ steps.package-info.outputs.previous_version }}
          NEW_VERSION: ${{ steps.package-info.outputs.new_version }}
          UPGRADE_TYPE: ${{ steps.package-info.outputs.upgrade_label }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const packageName = process.env.PACKAGE_NAME;
            const previousVersion = process.env.PREVIOUS_VERSION;
            const newVersion = process.env.NEW_VERSION;
            const upgradeType = process.env.UPGRADE_TYPE;
            const prNumber = context.issue.number;
            const currentDate = new Date().toISOString().split('T')[0];

            const newTitle = `[${upgradeType}] upgrade to ${packageName} from ${previousVersion} to ${newVersion}`;
            const newBody = `PR created on ${currentDate}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              title: newTitle,
              body: newBody,
            });

      - name: Check auto-merge eligibility
        id: check-auto-merge
        env:
          PACKAGES: ${{ steps.package-info.outputs.package_name }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          MINOR_AUTO_PACKAGES=" turbo typescript react react-dom wxt @wxt-dev/module-react swr bootstrap bootstrap-icons tailwindcss sass jest oxlint astro @types/react @types/react-dom "

          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
            echo "should_merge=true" >> $GITHUB_OUTPUT
          elif [[ "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            should_merge=true
            IFS=',' read -ra NAMES <<< "$PACKAGES"
            for name in "${NAMES[@]}"; do
              name="$(echo "$name" | xargs)"
              if [[ -z "$name" || "$MINOR_AUTO_PACKAGES" != *" $name "* ]]; then
                should_merge=false
              fi
            done
            echo "should_merge=$should_merge" >> $GITHUB_OUTPUT
          else
            echo "should_merge=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-merge if eligible
        if: steps.check-auto-merge.outputs.should_merge == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add review labels
        if: steps.check-auto-merge.outputs.should_merge == 'false'
        uses: actions/github-script@v9
        env:
          UPGRADE_TYPE: ${{ steps.package-info.outputs.upgrade_label }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-review', `${process.env.UPGRADE_TYPE}-upgrade`],
            });
