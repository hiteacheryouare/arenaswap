version: 2
updates:
  # A single npm block for the whole workspace. Dependabot requires each
  # package-ecosystem + directory + target-branch combination to be unique, so a
  # second npm block on '/' is silently dropped rather than merged.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '15:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    target-branch: 'mega'
    allow:
      - dependency-type: 'all'
    commit-message:
      prefix: 'Upgrade'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      frontend-stack:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
          - '@wxt-dev/*'
          - 'wxt'
          - 'bootstrap'
          - 'bootstrap-icons'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'sass'
          - 'astro'
          - '@astrojs/*'
          - 'echarts'
        update-types:
          - 'minor'
          - 'patch'
      build-tooling:
        patterns:
          - 'turbo'
          - 'typescript'
          - 'oxlint'
          - 'rolldown'
          - 'jest'
          - '@types/jest'
          - '@swc/*'
          - 'cypress'
        update-types:
          - 'minor'
          - 'patch'
    versioning-strategy: 'increase'
