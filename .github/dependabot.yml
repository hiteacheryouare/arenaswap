version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '15:00'
      timezone: 'America/New_York'
    cooldown:
      default-days: 7
      semver-major-days: 14
    versioning-strategy: 'increase'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    ignore:
      # Published from packages/powerscore; the npm copy trails the workspace, so a bump is a downgrade.
      - dependency-name: 'powerscore'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    target-branch: 'dev'
    schedule:
      interval: 'monthly'
      time: '15:00'
      timezone: 'America/New_York'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    groups:
      actions:
        patterns:
          - '*'
