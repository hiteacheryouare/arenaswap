proTip:
  label: 'Consejo:'
  general:
    t0: Usa el interruptor de la esquina superior derecha para pausar ArenaSwap sin perder tus ajustes.
    t1: ArenaSwap funciona mejor con dos o más pestañas de partidos abiertas a la vez.
    t2: Haz clic en cualquier tarjeta de partido para ver el desglose de su PowerScore.
    t3: ¿Mezclas deportes? Activa más ligas en Ajustes para cambiar entre todas a la vez.
    t4: Las jirafas y los erizos son geniales. Ver todos los partidos a la vez también.
    t5: ¡ArenaSwap funciona mejor cuanto más tiempo lo dejas correr!
  main:
    t0: Marca tus equipos favoritos para fijar sus partidos al principio de la lista.
    t1: Asigna una pestaña desde el menú desplegable junto a cada partido para que ArenaSwap sepa a dónde cambiar.
    t2: Un PowerScore más alto gana el cambio; fíjate en las insignias de colores.
    t3: Activa “Mostrar próximos partidos” en Ajustes para asignar pestañas antes de que empiece el partido.
    t4: ¿Todavía no hay partidos en vivo? El Modo demostración en Ajustes te deja ver cómo funciona ArenaSwap con partidos ficticios.
  setup:
    t0: Baja el tiempo de espera para cambiar de forma más agresiva en los finales caóticos.
    t1: Sube la bonificación de equipo favorito para asegurarte de que tu equipo casi siempre gane el cambio.
    t2: Aumenta el retardo de cambio para darte un instante antes de que la pestaña cambie de verdad.
    t3: El Modo demostración ejecuta partidos simulados, perfecto para ajustar los controles sin esperar acción en vivo.
    t4: La sensibilidad controla qué tan grande debe ser la ventaja de PowerScore antes de que ArenaSwap cambie.
  detail:
    t0: El PowerScore combina igualdad, presión de la recta final, impulso, cambios de ventaja y remontadas — luego aplica un impulso o penalización de volatilidad según cuánto oscile la probabilidad de victoria.
    t1: Se aplica una penalización cuando el reloj del partido apenas avanza entre actualizaciones.
    t2: Los partidos 0-0 reciben una pequeña penalización de PowerScore en los deportes donde el 0-0 no es emocionante.
    t3: Pasa el cursor sobre las gráficas para inspeccionar momentos concretos del partido.
    t4: Un equipo favorito en el enfrentamiento suma puntos extra al PowerScore.
    t5: El PowerScore crece a medida que avanza el partido — un partido reñido temprano se dispara hacia el pitido final.
    t6: ¿Empate en el último minuto? El PowerScore anticipa una probable prórroga para que nunca te pierdas el pitido final.

